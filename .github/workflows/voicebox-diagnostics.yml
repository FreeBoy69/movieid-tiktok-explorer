name: Inspect Voicebox service

on:
  workflow_dispatch:
    inputs:
      cancel_profile_id:
        description: Optional voice profile ID whose active generations should be cancelled
        required: false
        type: string

env:
  VPS_HOST: ${{ secrets.VPS_HOST || '212.95.34.95' }}
  VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
  VPS_USER: ${{ secrets.VPS_USER || 'root' }}
  VPS_APP_DIR: ${{ secrets.VPS_APP_DIR || '/opt/autoyt/app' }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS host key
        run: ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Inspect speech services
        env:
          CANCEL_PROFILE_ID: ${{ inputs.cancel_profile_id }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "APP_DIR='$VPS_APP_DIR' CANCEL_PROFILE_ID='$CANCEL_PROFILE_ID' bash -s" <<'REMOTE'
          set -euo pipefail
          echo "Matching service units"
          systemctl list-units --type=service --all --no-legend \
            | awk 'tolower($0) ~ /voicebox|qwen|chatterbox|text.to.speech|tts/ { print }'
          echo "Matching processes"
          ps -eo pid,etimes,comm,args \
            | awk 'tolower($0) ~ /voicebox|qwen|chatterbox/ && $0 !~ /awk/ { print }'
          echo "Voicebox listener ports"
          ss -ltnp | awk '$4 ~ /:(8000|17493)$/ { print }'
          echo "Configured Voicebox API"
          cd "$APP_DIR"
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request

          base = ""
          for name in (".env.local", ".env"):
              path = pathlib.Path(name)
              if not path.exists():
                  continue
              for raw in path.read_text(errors="ignore").splitlines():
                  key, sep, value = raw.partition("=")
                  if sep and key.strip() in {"VOICEBOX_BASE_URL", "VOICEBOX_URL"}:
                      base = value.strip().strip('"').strip("'").rstrip("/")
                      break
              if base:
                  break
          candidates = [base] if base else ["http://127.0.0.1:8000", "http://127.0.0.1:17493"]
          if not base:
              print("No configured remote URL; inspecting localhost defaults")
          for candidate in candidates:
              parsed = urllib.parse.urlsplit(candidate)
              print(f"API host: {parsed.scheme}://{parsed.hostname or '<unknown>'}{':' + str(parsed.port) if parsed.port else ''}")
              for suffix in ("/health", "/openapi.json"):
                  try:
                      with urllib.request.urlopen(candidate + suffix, timeout=15) as response:
                          payload = response.read()
                          print(f"{suffix}: HTTP {response.status}")
                          if suffix == "/openapi.json":
                              data = json.loads(payload)
                              paths = sorted(path for path in data.get("paths", {}) if any(term in path.lower() for term in ("history", "generate", "cancel", "admin", "health")))
                              print("Relevant API paths:", ", ".join(paths) or "none published")
                  except Exception as error:
                      print(f"{suffix}: {type(error).__name__}: {error}")
              try:
                  with urllib.request.urlopen(candidate + "/history?limit=100", timeout=15) as response:
                      payload = json.loads(response.read())
                  items = payload if isinstance(payload, list) else payload.get("items") or payload.get("history") or payload.get("generations") or []
                  active = [item for item in items if str(item.get("status", "")).lower() in {"queued", "pending", "processing", "generating", "running"}]
                  print(f"Active generations: {len(active)}")
                  for item in active:
                      generation_id = str(item.get("id", ""))
                      profile_id = str(item.get("profile_id") or item.get("profileId") or "")
                      print("ACTIVE", "id=" + generation_id, "status=" + str(item.get("status", "")), "profile=" + profile_id)
                      cancel_profile_id = os.environ.get("CANCEL_PROFILE_ID", "").strip()
                      if cancel_profile_id and profile_id == cancel_profile_id and generation_id:
                          request = urllib.request.Request(candidate + "/generate/" + urllib.parse.quote(generation_id) + "/cancel", method="POST")
                          with urllib.request.urlopen(request, timeout=15) as cancel_response:
                              print("CANCELLED", "id=" + generation_id, "http=" + str(cancel_response.status))
              except Exception as error:
                  print(f"/history: {type(error).__name__}: {error}")
          PY
          REMOTE
