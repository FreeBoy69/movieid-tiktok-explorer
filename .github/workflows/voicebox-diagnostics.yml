name: Inspect Voicebox service

on:
  workflow_dispatch:

env:
  VPS_HOST: ${{ secrets.VPS_HOST || '212.95.34.95' }}
  VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
  VPS_USER: ${{ secrets.VPS_USER || 'root' }}
  VPS_APP_DIR: ${{ secrets.VPS_APP_DIR || '/opt/autoyt/app' }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS host key
        run: ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Inspect speech services
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "APP_DIR='$VPS_APP_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          echo "Matching service units"
          systemctl list-units --type=service --all --no-legend \
            | awk 'tolower($0) ~ /voicebox|qwen|chatterbox|text.to.speech|tts/ { print }'
          echo "Matching processes"
          ps -eo pid,etimes,comm,args \
            | awk 'tolower($0) ~ /voicebox|qwen|chatterbox/ && $0 !~ /awk/ { print }'
          echo "Configured Voicebox API"
          cd "$APP_DIR"
          python3 - <<'PY'
          import json
          import pathlib
          import urllib.parse
          import urllib.request

          base = ""
          for name in (".env.local", ".env"):
              path = pathlib.Path(name)
              if not path.exists():
                  continue
              for raw in path.read_text(errors="ignore").splitlines():
                  key, sep, value = raw.partition("=")
                  if sep and key.strip() in {"VOICEBOX_BASE_URL", "VOICEBOX_URL"}:
                      base = value.strip().strip('"').strip("'").rstrip("/")
                      break
              if base:
                  break
          if not base:
              print("No configured remote URL; localhost defaults are in use")
              raise SystemExit(0)
          parsed = urllib.parse.urlsplit(base)
          print(f"Remote host: {parsed.scheme}://{parsed.hostname or '<unknown>'}{':' + str(parsed.port) if parsed.port else ''}")
          for suffix in ("/health", "/openapi.json"):
              try:
                  with urllib.request.urlopen(base + suffix, timeout=15) as response:
                      payload = response.read()
                      print(f"{suffix}: HTTP {response.status}")
                      if suffix == "/openapi.json":
                          data = json.loads(payload)
                          paths = sorted(path for path in data.get("paths", {}) if any(term in path.lower() for term in ("history", "generate", "cancel", "admin", "health")))
                          print("Relevant API paths:", ", ".join(paths) or "none published")
              except Exception as error:
                  print(f"{suffix}: {type(error).__name__}: {error}")
          PY
          REMOTE
