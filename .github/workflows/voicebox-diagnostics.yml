name: Inspect Voicebox service

on:
  workflow_dispatch:

env:
  VPS_HOST: ${{ secrets.VPS_HOST || '212.95.34.95' }}
  VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
  VPS_USER: ${{ secrets.VPS_USER || 'root' }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS host key
        run: ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Inspect speech services
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "Matching service units"
          systemctl list-units --type=service --all --no-legend \
            | awk 'tolower($0) ~ /voicebox|qwen|chatterbox|text.to.speech|tts/ { print }'
          echo "Matching processes"
          ps -eo pid,etimes,comm,args \
            | awk 'tolower($0) ~ /voicebox|qwen|chatterbox/ && $0 !~ /awk/ { print }'
          REMOTE
