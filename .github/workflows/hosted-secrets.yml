# Lists the hosted app's secret names (never values), or deletes the ones named, from the LingCode
# secrets vault (it caps at 32). Run by hand: gh workflow run hosted-secrets.yml [-f delete="A B"].
name: Hosted app secrets
on:
  workflow_dispatch:
    inputs:
      delete:
        description: Secret names to delete, separated by spaces (empty lists them)
        required: false
        default: ""
jobs:
  secrets:
    runs-on: ubuntu-latest
    env:
      LINGCODE_BACKEND_ID: ${{ vars.LINGCODE_BACKEND_ID || '32f0868d386a15ec19705ef0' }}
      LINGCODE_TOKEN: ${{ secrets.LINGCODE_TOKEN }}
      API: https://lingcode.dev/api/cloud/account/backends
    steps:
      - name: Delete the named secrets
        if: ${{ inputs.delete != '' }}
        env:
          NAMES: ${{ inputs.delete }}
        run: |
          for name in $NAMES; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE "$API/$LINGCODE_BACKEND_ID/secrets/$name" -H "Authorization: Bearer $LINGCODE_TOKEN")
            echo "delete $name: HTTP $code"
          done
      - name: List secret names
        run: |
          curl -s "$API/$LINGCODE_BACKEND_ID/secrets" -H "Authorization: Bearer $LINGCODE_TOKEN" \
            | python3 -c 'import json, sys; d = json.load(sys.stdin); items = (d.get("data") or d.get("secrets") or []) if isinstance(d, dict) else d; items = items.get("secrets", items) if isinstance(items, dict) else items; first = items[0] if items else {}; print("fields:", sorted(first.keys()) if isinstance(first, dict) else type(first).__name__); names = sorted(str(i.get("name") or i.get("key") or i.get("secretName") or i.get("id") or "?") if isinstance(i, dict) else str(i) for i in items); print(len(names), "secrets"); print("\n".join(names))'
